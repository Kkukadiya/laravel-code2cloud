<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="codes2cloud - Expert cloud consulting and digital transformation services. Coming soon!">
    <title>Coming Soon | codes2cloud</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: 222 47% 11%;
            --foreground: 210 40% 98%;
            --primary: 16 100% 60%;
            --primary-foreground: 222 47% 11%;
            --muted: 217 33% 17%;
            --muted-foreground: 215 20% 65%;
            --coral: 16 100% 60%;
            --coral-light: 16 100% 70%;
            --navy: 222 47% 11%;
            --navy-light: 217 33% 17%;
            --teal: 168 80% 45%;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, hsl(var(--navy)) 0%, hsl(var(--navy-light)) 100%);
            color: hsl(var(--foreground));
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        /* Background decorations */
        body::before {
            content: '';
            position: absolute;
            top: 20%;
            left: 10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, hsl(var(--coral) / 0.15) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: 10%;
            right: 5%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, hsl(var(--teal) / 0.1) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .container {
            max-width: 800px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, hsl(var(--coral)) 0%, hsl(var(--coral-light)) 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon svg {
            width: 24px;
            height: 24px;
            color: hsl(var(--navy));
        }

        .badge {
            display: inline-block;
            padding: 0.5rem 1.25rem;
            background: hsl(var(--coral) / 0.15);
            color: hsl(var(--coral));
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 2rem;
            animation: pulse-glow 2s ease-in-out infinite;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, hsl(var(--foreground)) 0%, hsl(var(--coral-light)) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .description {
            font-size: 1.125rem;
            color: hsl(var(--muted-foreground));
            line-height: 1.7;
            max-width: 600px;
            margin: 0 auto 3rem;
        }

        /* Social Links */
        .social-links {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
        }

        .social-link {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: hsl(var(--muted) / 0.5);
            border: 1px solid hsl(var(--coral) / 0.2);
            border-radius: 12px;
            color: hsl(var(--foreground));
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-link:hover {
            background: hsl(var(--coral));
            color: hsl(var(--navy));
            transform: translateY(-3px);
        }

        .social-link svg {
            width: 20px;
            height: 20px;
        }

        /* Footer */
        .footer {
            position: absolute;
            bottom: 2rem;
            text-align: center;
            color: hsl(var(--muted-foreground));
            font-size: 0.875rem;
        }

        /* Animations */
        @keyframes pulse-glow {
            0%, 100% {
                box-shadow: 0 0 20px hsl(var(--coral) / 0.3);
            }
            50% {
                box-shadow: 0 0 40px hsl(var(--coral) / 0.5);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .container {
            animation: float 6s ease-in-out infinite;
        }

        /* Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, hsl(var(--navy)) 0%, hsl(var(--navy-light)) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid hsl(var(--muted) / 0.3);
            border-top: 4px solid hsl(var(--coral));
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.25rem;
            font-weight: 600;
            color: hsl(var(--foreground));
            letter-spacing: 0.1em;
        }

        .loader-dots {
            display: inline-flex;
            gap: 4px;
        }

        .loader-dots span {
            width: 6px;
            height: 6px;
            background: hsl(var(--coral));
            border-radius: 50%;
            animation: bounce 1.4s ease-in-out infinite;
        }

        .loader-dots span:nth-child(1) { animation-delay: 0s; }
        .loader-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loader-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Responsive */
        @media (max-width: 640px) {
            .footer {
                position: relative;
                margin-top: 3rem;
                bottom: auto;
            }
        }
    </style>
</head>
<body>

    <script>
        // Hide loading screen after page loads
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.getElementById('loadingScreen').classList.add('hidden');

        });
    </script>
</body>
</html>
